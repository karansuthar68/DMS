spring.application.name=document-management-system
server.port=8080
# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/dms
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1

spring.data.web.pageable.max-page-size=100


app.jwt.secret=${JWT_SECRET:Gjw6vvTLnBly59Y5iswSd5yhBcjigCAj7Fp2vN0ZQOA=}
app.jwt.expiration-minutes=60

app.storage.upload-dir=./uploads
app.domain-restriction.enabled=true
app.domain-restriction.allowed-domains=localhost,127.0.0.1

app.seed-demo-users=true
