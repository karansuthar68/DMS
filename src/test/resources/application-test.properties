# Tests use an in-memory H2 database so they run anywhere and never touch the real PostgreSQL data
spring.datasource.url=jdbc:h2:mem:dms-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.storage.upload-dir=target/test-uploads
